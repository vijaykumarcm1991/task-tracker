<!DOCTYPE html>
<html>
<head>
    <title>Task Tracker - Kanban</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<div class="container-fluid p-4">

    <h2 class="mb-4 fw-bold">🚀 Task Tracker</h2>

    <!-- Analytics Cards -->
    <div class="row mb-4" id="statsRow">
    </div>

    <!-- Add Task Button -->
    <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#taskModal">
        + Add Task
    </button>

    <!-- Kanban Board -->
    <div class="row" id="board"></div>

</div>

<!-- Modal -->
<div class="modal fade" id="taskModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Add Task</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="text" id="taskTitle" class="form-control mb-3" placeholder="Task title">
        <textarea id="taskDesc" class="form-control mb-3" placeholder="Description"></textarea>
        <select id="taskPriority" class="form-select">
            <option value="LOW">Low</option>
            <option value="MEDIUM" selected>Medium</option>
            <option value="HIGH">High</option>
	<input type="date" id="taskDueDate" class="form-control mt-3">
        </select>
      </div>
      <div class="modal-footer">
        <button class="btn btn-success" onclick="createTask()">Save Task</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
